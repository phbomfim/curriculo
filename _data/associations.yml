# Associations
# comment out the urls if you do not wish to display them

- organization: Rails Girls Salvador
  role: Mentor
  year: 2019 &mdash; 2020
  url: http://railsgirls.com/salvador.html
  summary: Participei ativamente da realização do evento no território soteropolitano. 
           A proposta do Rails Girls é proporcionar à garotas a possibilidade de entrarem em contato com a programação, mesmo sem nenhum conhecimento prévio na área. 
           Acreditamos que com o crescimento das iniciativas voltadas para programação feminina, poderemos construir um cenário mais igualitário. 
           O Rails Girls iniciou na Finlândia e hoje toma proporções mundiais.

- organization: Onda Digital
  role: Instrutor
  year: 2019 &mdash; 2020
  url: http://ime.ufba.br/index.php/onda-digital/
  summary: Em 2019, com apoio do Onda Digital, ministrei o CIPROG nível 2 (Curso de iniciação à Programação de Computadores nível Avançado).
           O objetivo do curso é aprimorar os conhecimentos em programação com enfoque no desenvolvimento do raciocínio computacional de forma problematizada e contextualizada, incentivando o desenvolvimento lógico matemático, estimulando à capacidade na resolução de problemas.
           O curso foi ministrado em parceria com a Universidade Federal da Bahia (UFBA) e realizado no Instituto de Matemática e Estatística (IME).<br>

